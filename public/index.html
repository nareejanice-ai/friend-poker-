<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Friend Poker</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><section id="lobby" class="screen"><div class="brand">FRIEND <b>POKER</b><span>TOUR</span></div><div class="panel"><input id="name" placeholder="ชื่อผู้เล่น" value="ICE"><div class="row"><select id="variant"><option value="holdem">Texas Hold'em</option><option value="plo">PLO 4 Card</option></select><select id="seats"><option>6</option><option>8</option><option>10</option></select></div><div class="row"><select id="mode"><option value="tournament">Tournament</option><option value="cash">Cash Game</option></select><select id="stack"><option>1000</option><option>2500</option><option selected>4000</option><option>5000</option><option>10000</option><option>25000</option><option>50000</option><option>100000</option></select></div><div class="row"><select id="cashBB"><option value="20">BB 20</option><option value="50" selected>BB 50</option><option value="100">BB 100</option></select><button id="create" class="primary">สร้างโต๊ะ</button></div><div class="join"><input id="room" maxlength="6" placeholder="ROOM CODE"><button id="join">เข้าที่นั่ง</button></div><div id="lobbyStatus" class="muted">ระบบใหม่ • realtime server-authoritative</div></div></section><section id="game" class="screen hidden"><header><button id="leave" class="nav-btn" aria-label="ออกจากห้อง">← ออก</button><div class="room-head"><strong id="roomLabel"></strong><small id="connection">เชื่อมต่อแล้ว</small></div><div id="blind"></div></header><div class="table-wrap"><div class="rail"><div id="pot" class="pot"></div><div id="board" class="board"></div><div id="seatsLayer"></div><div class="table-logo">FRIEND<br><b>POKER TOUR</b></div></div></div><div id="status" class="status"></div><div id="hero" class="hero"></div><div id="controls" class="controls"><button data-a="fold">หมอบ</button><button data-a="call">เช็ก/ตาม</button><input id="raise" type="range"><button data-a="raise" class="primary">เกทับ</button><button data-a="allin" class="danger">ALL-IN</button></div><div class="presets" id="presets"></div><div class="room-actions"><button id="showCards" class="show-cards hidden">โชว์ไพ่</button><button id="sitout" class="sitout hidden">พักหลังมือนี้</button><button id="start" class="start hidden">เริ่มเกม</button></div></section></main><script src="/app.js"></script></body></html>
